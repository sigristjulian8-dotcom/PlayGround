<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NO MAN'S LAND</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto+Mono:wght@600&display=swap');
:root{--ink:#1b1a16;--paper:#d8c79e;--red:#a74732;--green:#7f8a63}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#191a16;color:#ddd1aa;font-family:'Roboto Mono',monospace;touch-action:none}canvas{display:block;width:100%;height:100%}.grain{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url('%23n)' opacity='.7'/%3E%3C/svg%3E")}.hud{position:absolute;z-index:5;inset:0;pointer-events:none}.topbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 32px));height:74px;background:rgba(28,29,23,.94);border:1px solid #777156;box-shadow:0 6px 20px #0008;display:flex;align-items:center;padding:8px 16px}.factions{display:flex;align-items:center;gap:12px}.flag{width:44px;height:44px;border-radius:50%;border:2px solid #a99b70;display:grid;place-items:center;font-family:Oswald;font-size:22px;color:#d8c79e}.flag.enemy{border-color:#765f4c}.meter{width:128px}.meter label{display:flex;justify-content:space-between;font-size:9px;text-transform:uppercase;margin-bottom:5px}.track{height:7px;background:#090a08;border:1px solid #62614d}.fill{height:100%;background:#9b9d66;transition:width .25s}.fill.e{background:#8e4d3c}.objective{margin-left:auto;text-align:right}.objective small{color:#aaa27f;font-size:9px}.objective b{display:block;margin-top:5px;font-family:Oswald;font-size:16px;letter-spacing:1px}.pause{position:absolute;right:10px;top:94px;width:38px;height:38px;border:1px solid #777156;background:#24261f;pointer-events:auto;color:#d8c79e;font-size:15px}.squad{position:absolute;left:14px;bottom:18px;width:230px;height:112px;background:rgba(28,29,23,.94);border:1px solid #777156;padding:10px}.squad h3{margin:0 0 8px;font-family:Oswald;font-size:13px;letter-spacing:2px}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.slot{height:61px;border:1px solid #62614d;background:#34362b;position:relative;overflow:hidden;cursor:pointer}.slot.selected{border:2px solid #d4c78f}.soldier{position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);width:30px;height:48px}.soldier i{display:block;position:absolute}.soldier .head{width:9px;height:9px;border-radius:50%;background:#9f9270;left:10px;top:2px}.soldier .body{width:18px;height:27px;background:#66705a;left:6px;top:12px;border-radius:7px 7px 2px 2px}.soldier .gun{width:25px;height:3px;background:#181915;left:15px;top:20px;transform:rotate(-12deg)}.slot.dead{filter:grayscale(1);opacity:.35}.hp{position:absolute;bottom:3px;left:3px;right:3px;height:3px;background:#111}.hp div{height:100%;background:#9b9d66}.orders{position:absolute;right:16px;bottom:18px;display:grid;grid-template-columns:repeat(3,54px);gap:7px}.order{height:54px;border:1px solid #777156;background:rgba(28,29,23,.94);color:#d8c79e;font-size:10px;pointer-events:auto;cursor:pointer}.order.active{background:#77765a;color:#171812}.order span{display:block;font-size:17px;margin-bottom:3px}.toast{position:absolute;left:50%;bottom:148px;transform:translateX(-50%);background:#25261f;border-left:3px solid #a74732;padding:9px 14px;font-size:11px;opacity:0;transition:.25s}.toast.show{opacity:1}.pauseOverlay,.start{position:absolute;z-index:8;inset:0;display:none;place-items:center;background:rgba(20,21,17,.82);pointer-events:auto}.start{display:grid}.panel{width:min(470px,calc(100% - 36px));border:1px solid #aaa27e;background:#25261f;padding:32px;text-align:center;box-shadow:0 18px 60px #000}.panel h1{font-family:Oswald;font-size:52px;line-height:.9;margin:8px 0 14px;letter-spacing:4px}.panel em{display:block;color:#9e9c79;font-size:10px;font-style:normal;letter-spacing:3px}.panel p{font-size:11px;line-height:1.8;color:#b9b18d}.panel button{margin-top:12px;border:1px solid #aaa27e;background:#77765a;color:#171812;width:180px;height:48px;font-family:Oswald;font-size:16px;letter-spacing:2px;cursor:pointer}.pauseOverlay .panel h1{font-size:38px}.bottomHint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:8px;color:#aaa27f;white-space:nowrap}@media(max-width:700px){.topbar{top:8px;height:62px;padding:6px}.meter{width:76px}.objective b{font-size:12px}.objective small{display:none}.flag{width:36px;height:36px}.squad{bottom:8px;left:8px;width:188px;height:98px}.slot{height:54px}.orders{right:8px;bottom:8px;grid-template-columns:repeat(3,46px)}.order{height:46px}.pause{top:78px}.bottomHint{display:none}.panel h1{font-size:42px}}
</style>
</head>
<body><canvas id="c"></canvas><div class="grain"></div><div class="hud">
<div class="topbar"><div class="factions"><div class="flag">V</div><div class="meter"><label><span>British</span><b id="allyPct">100%</b></label><div class="track"><div id="allyBar" class="fill" style="width:100%"></div></div></div></div><div class="objective"><small>MISSION 07 · WESTERN FRONT</small><b id="objective">SECURE THE NORTHERN LINE</b></div><div class="factions"><div class="meter"><label><span>German</span><b id="enemyPct">100%</b></label><div class="track"><div id="enemyBar" class="fill e" style="width:100%"></div></div></div><div class="flag enemy">E</div></div></div>
<button class="pause" id="pauseBtn">Ⅱ</button><div class="squad"><h3>YOUR SECTION · 4 MEN</h3><div class="slots" id="slots"></div></div><div class="orders"><button class="order active" data-order="move"><span>➜</span>MOVE</button><button class="order" data-order="fire"><span>⌖</span>FIRE</button><button class="order" data-order="cover"><span>◆</span>COVER</button></div><div class="toast" id="toast">SECTION MOVING</div><div class="bottomHint">WASD CAMERA · RIGHT CLICK FIRE · SPACE ARTILLERY</div></div>
<div class="start" id="start"><div class="panel"><em>WESTERN FRONT · 1917</em><h1>NO MAN'S<br>LAND</h1><p>Lead the section across contested ground.<br>Find cover. Watch the barrage. Hold the line.</p><button id="startBtn">BEGIN ASSAULT</button></div></div><div class="pauseOverlay" id="pauseOverlay"><div class="panel"><h1>ORDERS PAUSED</h1><button id="resumeBtn">RESUME</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
let cam={x:0,y:-20};const world={w:1000,h:620};let started=false,paused=false,order='move',shells=[],bullets=[],particles=[],shake=0,gameTime=0,allyScore=100,enemyScore=100;
const rnd=(a,b)=>a+Math.random*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ally=[],enemy=[];for(let i=0;i<4;i++)ally.push({x:300+rnd(-18,18),y:470+rnd(-18,18),hp:100,selected:i===0,dir:0,cover:false,dead:false});for(let i=0;i<5;i++)enemy.push({x:650+rnd(-150,150),y:150+rnd(-70,70),hp:100,dead:false,shoot:rnd(0,3)});
const craters=[];for(let i=0;i<24;i++)craters.push({x:rnd(100,900),y:rnd(80,540),r:rnd(12,34)});const wire=[];for(let i=0;i<13;i++)wire.push({x:rnd(420,540),y:rnd(280,390)});const debris=[];for(let i=0;i<80;i++)debris.push({x:rnd(40,960),y:rnd(40,580),r:rnd(2,7),a:rnd(0,6)});
function iso(x,y){return{x:(x-world.w/2)*.78-(y-world.h/2)*.78+W/2+cam.x,y:(x-world.w/2)*.38+(y-world.h/2)*.38+H*.42+cam.y}}
function inv(mx,my){const dx=mx-W/2-cam.x,dy=my-H*.42-cam.y;const ax=dx/.78,ay=dy/.38;return{x:(ax+ay)/2+world.w/2,y:(ay-ax)/2+world.h/2}}
function groundPoly(){const a=iso(0,0),b=iso(world.w,0),c=iso(world.w,world.h),d=iso(0,world.h);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.fillStyle='#7a765e';ctx.fill();ctx.strokeStyle='#66634e';ctx.lineWidth=2;ctx.stroke()}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fillStyle=color;ctx.fill()}
function drawTrench(){// rear and front trench bands
 function band(y,side){ctx.beginPath();for(let x=40;x<960;x+=12){let p=iso(x,y+Math.sin(x*.05)*5);if(x===40)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.strokeStyle='#3a3528';ctx.lineWidth=32;ctx.stroke();ctx.strokeStyle='#4e4a38';ctx.lineWidth=24;ctx.stroke();ctx.strokeStyle='#26271f';ctx.lineWidth=4;ctx.stroke();for(let x=70;x<930;x+=45){let p=iso(x,y+Math.sin(x*.05)*5);ctx.fillStyle='#5a563f';ctx.fillRect(p.x-7,p.y-5,14,10)}}band(510,1);band(110,0)
 // sandbags
 for(let x=80;x<940;x+=31){let p=iso(x,501);ellipse(p.x,p.y,10,5,'#aaa07a');let q=iso(x,119);ellipse(q.x,q.y,10,5,'#aaa07a')}}
function drawCraters(){craters.forEach(q=>{let p=iso(q.x,q.y);ellipse(p.x,p.y,q.r*.9,q.r*.38,'#5a5541');ellipse(p.x,p.y,q.r*.55,q.r*.24,'#292a22')})}
function drawWire(){wire.forEach((w,i)=>{let p=iso(w.x,w.y);ctx.strokeStyle='#49483d';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,10+i%3,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x-12,p.y+3);ctx.lineTo(p.x+12,p.y-3);ctx.stroke()})}
function drawUnit(u,friendly){if(u.dead)return;let p=iso(u.x,u.y);ctx.save();ctx.translate(p.x,p.y);let sel=friendly&&u.selected;if(sel){ctx.strokeStyle='#d8c79e';ctx.setLineDash([4,3]);ctx.beginPath();ctx.ellipse(0,8,15,5,0,0,7);ctx.stroke();ctx.setLineDash([])}ctx.fillStyle='#171912';ctx.beginPath();ctx.ellipse(0,7,12,5,0,0,7);ctx.fill();ctx.fillStyle=friendly?'#65705a':'#696551';ctx.fillRect(-7,-20,14,23);ctx.fillStyle='#9a8b66';ctx.beginPath();ctx.arc(0,-22,6,0,7);ctx.fill();ctx.fillStyle=friendly?'#697157':'#514f43';ctx.fillRect(-8,-26,16,5);ctx.strokeStyle='#171812';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(5,-12);ctx.lineTo(23,-17);ctx.stroke();if(u.hp<100){ctx.fillStyle='#111';ctx.fillRect(-10,-34,20,3);ctx.fillStyle='#8a4d3d';ctx.fillRect(-10,-34,20*u.hp/100,3)}ctx.restore()}
function drawParticles(){particles.forEach(p=>{let q=iso(p.x,p.y);ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(q.x,q.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1})}
function fireAt(a,b){let pa=iso(a.x,a.y),pb=iso(b.x,b.y);bullets.push({from:pa,to:pb,life:1});b.hp-=rnd(7,16);if(b.hp<=0){b.hp=0;b.dead=true;enemyScore-=18}}
function update(dt){if(!started||paused)return;gameTime+=dt;if(Math.random()<dt*.28){let e=enemy.find(v=>!v.dead);if(e){let a=ally.find(v=>!v.dead&&(!v.cover||Math.random()<.6));if(a&&!e.dead)fireAt(e,a)}}ally.forEach(u=>{if(u.dead)return;if(u.target){let dx=u.target.x-u.x,dy=u.target.y-u.y,d=Math.hypot(dx,dy);if(d>5){u.x+=dx/d*48*dt;u.y+=dy/d*48*dt;u.dir=Math.atan2(dy,dx)}else u.target=null}if(order==='fire'&&!u.target){let e=enemy.find(v=>!v.dead&&Math.hypot(v.x-u.x,v.y-u.y)<300);if(e&&Math.random()<dt*1.4)fireAt(u,e)}});enemy.forEach(e=>{if(!e.dead){e.shoot-=dt;if(e.shoot<=0){let a=ally.find(v=>!v.dead&&(!v.cover||Math.random()<.55));if(a)fireAt(e,a);e.shoot=rnd(1.2,3.2)}}});bullets.forEach(b=>b.life-=dt*4);bullets=bullets.filter(b=>b.life>0);particles.forEach(p=>{p.life-=dt;p.r+=dt*8});particles=particles.filter(p=>p.life>0);shells.forEach(s=>{s.life-=dt;if(s.life<=0){shake=12;let p=iso(s.x,s.y);for(let i=0;i<18;i++)particles.push({x:s.x+rnd(-25,25),y:s.y+rnd(-25,25),r:rnd(3,9),life:rnd(.4,1),color:i%3?'#dfb36b':'#4a4940'});ally.concat(enemy).forEach(u=>{if(!u.dead&&Math.hypot(u.x-s.x,u.y-s.y)<75){u.hp-=u.cover?rnd(5,12):rnd(18,32);if(u.hp<=0){u.hp=0;u.dead=true;if(ally.includes(u))allyScore-=20}else if(enemy.includes(u)&&u.hp<=0){u.hp=0;u.dead=true;enemyScore-=18}}})}});shells=shells.filter(s=>s.life>0);allyScore=clamp(allyScore,0,100);enemyScore=clamp(enemyScore,0,100);document.getElementById('allyBar').style.width=allyScore+'%';document.getElementById('enemyBar').style.width=enemyScore+'%';document.getElementById('allyPct').textContent=Math.round(allyScore)+'%';document.getElementById('enemyPct').textContent=Math.round(enemyScore)+'%';if(enemyScore<=0||enemy.every(e=>e.dead)){enemyScore=0;document.getElementById('objective').textContent='LINE SECURED';showToast('SECTOR SECURED')}
 if(allyScore<=0||ally.every(u=>u.dead)){allyScore=0;document.getElementById('objective').textContent='SECTION LOST';showToast('WITHDRAWAL AUTHORIZED')}}
let last=performance.now();function frame(now){let dt=Math.min((now-last)/1000,.05);last=now;update(dt);ctx.save();if(shake>0){ctx.translate(rnd(-shake,shake),rnd(-shake,shake));shake*=.86}ctx.clearRect(-30,-30,W+60,H+60);groundPoly();drawCraters();drawTrench();debris.forEach(d=>{let p=iso(d.x,d.y);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(d.a);ctx.fillStyle='#3d3d32';ctx.fillRect(-d.r/2,-1,d.r,2);ctx.restore()});drawWire();[...ally,...enemy].sort((a,b)=>a.y-b.y).forEach(u=>drawUnit(u,ally.includes(u)));bullets.forEach(b=>{ctx.strokeStyle='rgba(245,220,150,.8)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(b.from.x,b.from.y);ctx.lineTo(b.to.x,b.to.y);ctx.stroke()});drawParticles();ctx.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function renderSlots(){let el=document.getElementById('slots');el.innerHTML='';ally.forEach((u,i)=>{let s=document.createElement('div');s.className='slot'+(u.selected?' selected':'')+(u.dead?' dead':'');s.innerHTML=`<div class="soldier"><i class="head"></i><i class="body"></i><i class="gun"></i></div><div class="hp"><div style="width:${u.hp}%"></div></div>`;s.onclick=()=>{ally.forEach(x=>x.selected=false);if(!u.dead){u.selected=true;renderSlots()}};el.appendChild(s)})}renderSlots();
cv.addEventListener('pointerdown',e=>{if(!started||paused)return;let r=cv.getBoundingClientRect(),pos=inv(e.clientX-r.left,e.clientY-r.top);if(order==='move'||order==='cover'){ally.filter(u=>u.selected&&!u.dead).forEach((u,i)=>{u.target={x:clamp(pos.x+(i-1)*18,30,970),y:clamp(pos.y+(i%2)*18,20,600)};if(order==='cover')u.cover=true;else u.cover=false});showToast(order==='cover'?'SECTION IN COVER':'SECTION MOVING')}else if(order==='fire'){enemy.find(v=>!v.dead&&Math.hypot(iso(v.x,v.y).x-e.clientX,iso(v.x,v.y).y-e.clientY)<25)?.hp>0&&ally.filter(u=>u.selected&&!u.dead).forEach(u=>{let es=enemy.filter(v=>!v.dead);if(es[0])fireAt(u,es[0])})}});
document.querySelectorAll('.order').forEach(b=>b.onclick=()=>{document.querySelectorAll('.order').forEach(x=>x.classList.remove('active'));b.classList.add('active');order=b.dataset.order;showToast(order==='fire'?'WEAPONS FREE':order==='cover'?'TAKE COVER':'MOVE ORDERS')});
let toastT;function showToast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1500)}
document.getElementById('startBtn').onclick=()=>{started=true;document.getElementById('start').style.display='none';showToast('ASSAULT IN PROGRESS'};
document.getElementById('pauseBtn').onclick=()=>{paused=!paused;document.getElementById('pauseOverlay').style.display=paused?'grid':'none'};document.getElementById('resumeBtn').onclick=()=>{paused=false;document.getElementById('pauseOverlay').style.display='none'};
addEventListener('keydown',e=>{if(e.code==='Escape'){paused=!paused;document.getElementById('pauseOverlay').style.display=paused?'grid':'none'}if(e.code==='Space'&&!paused&&started){e.prevent;let a=inv(W*.5,H*.48);shells.push({x:clamp(a.x+rnd(-100,100),100,900),y:clamp(a.y+rnd(-70,70),100,520),life:.8});showToast('BARRAGE CALLED')}});
</script></body></html>
